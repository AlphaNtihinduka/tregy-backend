name: CI

# Builds and tests the backend on every push and PR to main. No deploy yet (no hosting).
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      # The wrapper loses its executable bit when committed from Windows.
      - run: chmod +x mvnw
      # Integration tests start PostgreSQL 17 with Testcontainers (Docker is on the runner).
      - run: ./mvnw -B verify
      - name: Print test reports
        if: failure()
        run: find target/surefire-reports -name "*.txt" -exec cat {} \;
