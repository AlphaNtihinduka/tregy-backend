# Test-only values. None of these are real secrets. The datasource itself comes from the
# Testcontainers PostgreSQL 17 container (@ServiceConnection in BaseIntegrationTest).
spring.datasource.password=test
app.jwt.secret=test-only-secret-that-is-more-than-thirty-two-bytes-long
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=2592000000
app.public-url=tregy://
# High so the many sign-ups across the test suite never hit the per-address limit.
app.rate-limit.ip-requests=10000
