spring.application.name=tregy-backend
# 8092 for local runs (Expo Metro holds 8081, NGOFinanza uses 8090, Selah 8091); the container sets SERVER_PORT=8081.
server.port=${SERVER_PORT:8092}

# --- Database (PostgreSQL 17). In Docker the host is the "postgres" service, never localhost.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tregy}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tregy}
# No fallback for the secret.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# Flyway owns the schema; Hibernate only checks it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# CORS origins for the web clients (none planned), comma separated. Never "*": the refresh
# cookie needs an explicit list.

# Only the health endpoint is exposed by Actuator, without details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Never echo request bodies or parameters into logs (AGENTS.md privacy rules).
logging.level.org.springframework.web=INFO

# --- Accounts and sessions. JWT_SECRET has no fallback: startup fails without it.
app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}
app.jwt.refresh-reuse-grace-ms=${JWT_REFRESH_REUSE_GRACE_MS:10000}
# Base of the verification and reset links sent by email (the app deep link).
app.public-url=${PUBLIC_APP_URL:tregy://}
# Account deletion (ADR 0009): days between asking and the account being removed, and when the daily
# purge runs (Spring cron; "-" turns the schedule off).
app.account-deletion.grace-days=${ACCOUNT_DELETION_GRACE_DAYS:14}
app.account-deletion.purge-cron=${ACCOUNT_DELETION_PURGE_CRON:0 30 3 * * *}
# Email provider (Resend). With no key, emails are suppressed and only logged without the link target.
app.email.resend-api-key=${RESEND_API_KEY:}
app.email.from=${EMAIL_FROM:}

# Requests per client address per 10 minutes on login, register, refresh and recovery endpoints.
app.rate-limit.ip-requests=${RATE_LIMIT_IP_REQUESTS:10}

# JWT is the only authentication: no default in-memory user (and no generated password in the log).
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# --- Content generation (phase 5). Only the fake provider exists: no model is called and no key is needed.
app.generation.provider=${GENERATION_PROVIDER:fake}
app.generation.model-id=${GENERATION_MODEL_ID:fake-model}
app.generation.max-items-per-run=${MAX_ITEMS_PER_RUN:100}
# Estimated spend cap per calendar month (UTC). A run stops cleanly when it is reached.
app.generation.monthly-budget-usd=${MONTHLY_GENERATION_BUDGET:50}
# Prices come from config, never hard-coded, because they change.
app.generation.input-usd-per-million-tokens=${GENERATION_INPUT_USD_PER_MTOK:0}
app.generation.output-usd-per-million-tokens=${GENERATION_OUTPUT_USD_PER_MTOK:0}
