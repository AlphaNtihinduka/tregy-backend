spring.application.name=tregy-backend
# 8092 for local runs (Expo Metro holds 8081, NGOFinanza uses 8090, Selah 8091); the container sets SERVER_PORT=8081.
server.port=${SERVER_PORT:8092}

# --- Database (PostgreSQL 17). In Docker the host is the "postgres" service, never localhost.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tregy}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tregy}
# No fallback for the secret.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# Flyway owns the schema; Hibernate only checks it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# CORS origins for the web clients (none planned), comma separated. Never "*": the refresh
# cookie needs an explicit list.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Only the health endpoint is exposed by Actuator, without details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Never echo request bodies or parameters into logs (AGENTS.md privacy rules).
logging.level.org.springframework.web=INFO
